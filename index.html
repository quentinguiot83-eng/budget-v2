<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        const dark = localStorage.getItem("wimm-night-mode") === "1";
        document.documentElement.dataset.mode = dark ? "dark" : "light";
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = dark ? "black-translucent" : "default";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#17212b" : "#ffffff";
      } catch {}
    </script>
    <meta
      name="description"
      content="Votre budget, votre épargne et vos voyages, réunis en famille."
    />
    <link rel="icon" href="/wimm-icon.png" />
    <link rel="apple-touch-icon" href="/wimm-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Wimm — Where is my money?</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
