<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body { background-color: var(--status-bar-background, #ffffff) !important; }
      #app-status-bar { position: fixed; top: 0; left: 0; right: 0; height: max(1px, env(safe-area-inset-top, 0px)); background-color: var(--status-bar-background, #ffffff); z-index: 200; pointer-events: none; }
      /* Keep an actual coloured strip at the top for iOS edge-colour sampling,
         even when a standalone iPhone reports a zero-pixel safe-area inset. */
      @media (max-width: 850px) {
        #app-status-bar { height: max(8px, env(safe-area-inset-top, 0px)); }
      }
    </style>
    <script>
      try {
        const saved = localStorage.getItem("wimm-appearance-mode");
        const legacy = localStorage.getItem("wimm-night-mode");
        const mode = ["light", "dark", "auto"].includes(saved) ? saved : legacy === "1" ? "dark" : legacy === "0" ? "light" : "auto";
        const dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.setProperty("--status-bar-background", dark ? "#202331" : "#ffffff");
        document.querySelector('meta[name="theme-color"]').content = dark ? "#202331" : "#ffffff";
      } catch {}
    </script>
    <meta
      name="description"
      content="Votre budget, votre épargne et vos voyages, réunis en famille."
    />
    <link rel="icon" href="/wimm-icon.png" />
    <link rel="apple-touch-icon" href="/wimm-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Wimm — Where is my money?</title>
  </head>
  <body>
    <div id="app-status-bar" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
