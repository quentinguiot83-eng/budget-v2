<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <script>
      // iPhone only: prevent accidental pinch/double-tap viewport zoom in the PWA.
      // Desktop zoom and system-level accessibility magnification are unchanged.
      if (/iPhone|iPod/i.test(navigator.userAgent)) {
        const viewport = document.querySelector('meta[name="viewport"]');
        viewport?.setAttribute(
          "content",
          "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover",
        );
      }
    </script>
    <script>
      // iPhone : suivre la taille du texte choisie dans Réglages → Luminosité et
      // affichage → Taille du texte. 17 px est la taille standard d'iOS, qui
      // correspond aux 16 px de Wimm ; plafonné à 135 % pour garder la mise en page.
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && CSS.supports("font", "-apple-system-body")) {
        const applyTextSize = () => {
          const probe = document.createElement("span");
          probe.style.font = "-apple-system-body";
          document.documentElement.appendChild(probe);
          const system = parseFloat(getComputedStyle(probe).fontSize) || 17;
          probe.remove();
          const size = Math.min(16 * 1.35, Math.max(14, system * 16 / 17));
          document.documentElement.style.fontSize = size === 16 ? "" : size + "px";
        };
        applyTextSize();
        document.addEventListener("visibilitychange", () => { if (!document.hidden) applyTextSize(); });
      }
    </script>
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html, body { background-color: var(--status-bar-background, #ffffff) !important; }
      #app-status-bar { position: fixed; top: 0; left: 0; right: 0; height: max(1px, env(safe-area-inset-top, 0px)); background-color: var(--status-bar-background, #ffffff); z-index: 200; pointer-events: none; }
    </style>
    <script>
      try {
        const saved = localStorage.getItem("wimm-appearance-mode");
        const legacy = localStorage.getItem("wimm-night-mode");
        const mode = ["light", "dark", "auto"].includes(saved) ? saved : legacy === "1" ? "dark" : legacy === "0" ? "light" : "auto";
        const dark = mode === "dark" || (mode === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.setProperty("--status-bar-background", dark ? "#0c1215" : "#ffffff");
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0c1215" : "#ffffff";
      } catch {}
    </script>
    <meta
      name="description"
      content="Ton budget, ton épargne et tes voyages, réunis en famille."
    />
    <link rel="icon" href="/wimm-icon.png" />
    <link rel="apple-touch-icon" href="/wimm-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Wimm — Where is my money?</title>
  </head>
  <body>
    <div id="app-status-bar" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
