<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1215" media="(prefers-color-scheme: dark)">
<title>Wimm · Pas de connexion</title>
<style>
  :root { --bg: #f8f9fd; --surface: #ffffff; --ink: #252438; --muted: #64667d; --border: #ececf4; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161925; --surface: #202331; --ink: #f0eef9; --muted: #acadc3; --border: #303345; } }
  * { box-sizing: border-box; }
  html { font: -apple-system-body; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font-family: "DM Sans", system-ui, -apple-system, sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
  main { width: min(100%, 360px); background: var(--surface); border: 1px solid var(--border); border-radius: 24px;
    padding: 32px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; }
  img { width: 56px; height: 56px; border-radius: 16px; }
  h1 { margin: 8px 0 0; font-size: 1.25rem; letter-spacing: -.02em; }
  p { margin: 0; color: var(--muted); line-height: 1.45; font-size: .9375rem; }
  button { margin-top: 12px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: var(--ink); color: var(--surface);
    font: inherit; font-weight: 600; font-size: 1rem; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/favicon.svg" alt="">
  <h1>Pas de connexion</h1>
  <p>Wimm a besoin d’internet pour afficher tes comptes à jour. Vérifie ton Wi-Fi ou tes données mobiles, puis réessaie.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
