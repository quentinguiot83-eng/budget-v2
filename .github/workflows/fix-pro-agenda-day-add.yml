name: Fix Pro agenda day add

on:
  push:
    branches:
      - fix/pro-agenda-click-add

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pro-agenda-click-add
          fetch-depth: 0
      - name: Apply fix
        run: node scripts/fix-pro-agenda-day-add.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/ProWorkspace.tsx; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProWorkspace.tsx
          git commit -m "Permettre l’ajout d’événement depuis un jour du calendrier"
          git push origin HEAD:fix/pro-agenda-click-add
