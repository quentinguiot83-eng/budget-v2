name: Apply Pro native refactor

on:
  push:
    branches:
      - refactor/pro-native-navigation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/pro-native-navigation
          fetch-depth: 0

      - name: Integrate agenda deletion
        run: node scripts/integrate-agenda-native.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/ProWorkspace.tsx src/main.tsx src/pro-suite.css; then
            echo "No generated source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProWorkspace.tsx src/main.tsx src/pro-suite.css
          git commit -m "Intégrer la suppression des rendez-vous au workspace Pro"
          git push origin HEAD:refactor/pro-native-navigation
