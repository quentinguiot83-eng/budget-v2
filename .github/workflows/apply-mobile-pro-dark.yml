name: Apply mobile Pro and dark mode

on:
  push:
    branches:
      - feature/pro-billing-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pro-billing-v2
          fetch-depth: 0

      - name: Apply fixes
        run: node scripts/apply-mobile-pro-dark.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/App.tsx src/ProWorkspace.tsx src/main.tsx src/style.css src/pro-suite.css src/pro-business.css src/pro-billing-v2.css; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/ProWorkspace.tsx src/main.tsx src/style.css src/pro-suite.css src/pro-business.css src/pro-billing-v2.css
          git commit -m "Corriger le mobile Pro et ajouter le mode nuit"
          git push origin HEAD:feature/pro-billing-v2
