name: Fix Pro mobile shell height

on:
  push:
    branches:
      - feature/pro-billing-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/pro-billing-v2
          fetch-depth: 0
      - name: Apply fix
        run: node scripts/fix-pro-shell-mobile-height.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/pro-suite.css; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pro-suite.css
          git commit -m "Corriger la hauteur du menu Pro sur mobile"
          git push origin HEAD:feature/pro-billing-v2
