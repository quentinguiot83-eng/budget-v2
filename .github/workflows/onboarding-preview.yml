name: Onboarding Preview Checks
on:
  push:
    branches:
      - feature/onboarding-progressive-aurora-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Onboarding regression tests
        run: node --import tsx --test src/onboarding.test.ts
      - name: Typecheck and build
        run: npm run build
