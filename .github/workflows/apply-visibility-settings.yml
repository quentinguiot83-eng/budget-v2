name: Apply visibility settings

on:
  push:
    branches:
      - feature/personal-visibility-descriptions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/personal-visibility-descriptions
          fetch-depth: 0

      - name: Apply changes
        run: node scripts/apply-visibility-settings.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit generated source
        run: |
          if git diff --quiet -- src/App.tsx src/style.css; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/style.css
          git commit -m "Rendre Compte perso masquable et décrire les rubriques"
          git push origin HEAD:feature/personal-visibility-descriptions
