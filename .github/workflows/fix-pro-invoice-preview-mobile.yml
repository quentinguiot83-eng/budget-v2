name: Fix Pro invoice preview mobile

on:
  push:
    branches:
      - fix/pro-invoice-preview-mobile

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pro-invoice-preview-mobile
          fetch-depth: 0
      - name: Apply fix
        run: node scripts/fix-pro-invoice-preview-mobile.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/ProBillingV2.tsx src/pro-billing-v2.css; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProBillingV2.tsx src/pro-billing-v2.css
          git commit -m "Corriger l’aperçu facture sur mobile"
          git push origin HEAD:fix/pro-invoice-preview-mobile
