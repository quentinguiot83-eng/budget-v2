name: Fix Pro agenda month navigation

on:
  push:
    branches:
      - fix/pro-agenda-month-navigation

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pro-agenda-month-navigation
          fetch-depth: 0
      - name: Apply fix
        run: node scripts/fix-pro-agenda-monthnav.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/ProWorkspace.tsx src/pro-suite.css; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProWorkspace.tsx src/pro-suite.css
          git commit -m "Aligner la navigation de l’agenda Pro sur le calendrier des paiements"
          git push origin HEAD:fix/pro-agenda-month-navigation
